---
- name: Wait for the RDS MySQL endpoint
  ansible.builtin.wait_for:
    host: "{{ mysql_fqdn }}"
    port: 3306
    state: started
    timeout: 300
  delegate_to: "{{ groups['backend'][0] }}"
  become: false

- name: Create the EpicBook database marker directory
  ansible.builtin.file:
    path: /var/lib/epicbook
    state: directory
    owner: root
    group: root
    mode: "0755"
  delegate_to: "{{ groups['backend'][0] }}"
  become: true

- name: Check the schema initialization marker
  ansible.builtin.stat:
    path: /var/lib/epicbook/schema-initialized
  register: schema_marker
  delegate_to: "{{ groups['backend'][0] }}"
  become: true

- name: Import the EpicBook database schema
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: /opt/epicbook/db/BuyTheBook_Schema.sql
    login_host: "{{ mysql_fqdn }}"
    login_port: 3306
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  delegate_to: "{{ groups['backend'][0] }}"
  become: false
  no_log: true
  when: not schema_marker.stat.exists

- name: Mark schema initialization as complete
  ansible.builtin.file:
    path: /var/lib/epicbook/schema-initialized
    state: touch
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['backend'][0] }}"
  become: true
  when: not schema_marker.stat.exists

- name: Count existing EpicBook authors
  community.mysql.mysql_query:
    login_db: "{{ db_name }}"
    login_host: "{{ mysql_fqdn }}"
    login_port: 3306
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    query: "SELECT COUNT(*) AS row_count FROM Author"
  register: existing_author_count
  delegate_to: "{{ groups['backend'][0] }}"
  become: false
  no_log: true

- name: Count existing EpicBook books
  community.mysql.mysql_query:
    login_db: "{{ db_name }}"
    login_host: "{{ mysql_fqdn }}"
    login_port: 3306
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    query: "SELECT COUNT(*) AS row_count FROM Book"
  register: existing_book_count
  delegate_to: "{{ groups['backend'][0] }}"
  become: false
  no_log: true

- name: Check the author seed marker
  ansible.builtin.stat:
    path: /var/lib/epicbook/authors-seeded
  register: author_marker
  delegate_to: "{{ groups['backend'][0] }}"
  become: true

- name: Check the book seed marker
  ansible.builtin.stat:
    path: /var/lib/epicbook/books-seeded
  register: book_marker
  delegate_to: "{{ groups['backend'][0] }}"
  become: true

- name: Refuse unsafe seed initialization
  ansible.builtin.assert:
    that:
      - (author_marker.stat.exists and book_marker.stat.exists) or ((existing_author_count.query_result[0][0].row_count | int == 0) and (existing_book_count.query_result[0][0].row_count | int == 0))
    fail_msg: >-
      Database seed initialization stopped because initialization markers
      are missing while existing author or book records were detected.
      Review the database state before proceeding.
    success_msg: Database state permits the configured seed initialization.

- name: Import EpicBook author seed data
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: /opt/epicbook/db/author_seed.sql
    login_host: "{{ mysql_fqdn }}"
    login_port: 3306
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  delegate_to: "{{ groups['backend'][0] }}"
  become: false
  no_log: true
  when:
    - not author_marker.stat.exists
    - existing_author_count.query_result[0][0].row_count | int == 0
    - existing_book_count.query_result[0][0].row_count | int == 0

- name: Mark author seeding as complete
  ansible.builtin.file:
    path: /var/lib/epicbook/authors-seeded
    state: touch
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['backend'][0] }}"
  become: true
  when: not author_marker.stat.exists

- name: Import EpicBook book seed data
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: import
    target: /opt/epicbook/db/books_seed.sql
    login_host: "{{ mysql_fqdn }}"
    login_port: 3306
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
  delegate_to: "{{ groups['backend'][0] }}"
  become: false
  no_log: true
  when:
    - not book_marker.stat.exists
    - existing_author_count.query_result[0][0].row_count | int == 0
    - existing_book_count.query_result[0][0].row_count | int == 0

- name: Mark book seeding as complete
  ansible.builtin.file:
    path: /var/lib/epicbook/books-seeded
    state: touch
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['backend'][0] }}"
  become: true
  when: not book_marker.stat.exists

- name: Verify the EpicBook database tables
  community.mysql.mysql_query:
    login_db: "{{ db_name }}"
    login_host: "{{ mysql_fqdn }}"
    login_port: 3306
    login_user: "{{ db_admin_username }}"
    login_password: "{{ db_admin_password }}"
    query: >-
      SELECT table_name
      FROM information_schema.tables
      WHERE table_schema = '{{ db_name }}'
        AND table_name IN ('Author', 'Book', 'Cart')
  register: epicbook_database_tables
  delegate_to: "{{ groups['backend'][0] }}"
  become: false
  no_log: true

- name: Confirm that all required database tables exist
  ansible.builtin.assert:
    that:
      - epicbook_database_tables.query_result[0] | length == 3
    fail_msg: "Database verification failed: one or more required tables are missing."
    success_msg: "Database verification passed: all three required tables exist."
  no_log: true

- name: Mark database initialization as complete
  ansible.builtin.file:
    path: /var/lib/epicbook/database-initialized
    state: touch
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ groups['backend'][0] }}"
  become: true
