---
- name: Prepare all EpicBook servers
  hosts: frontend:backend
  become: true
  roles:
    - common

- name: Configure the EpicBook backend
  hosts: backend
  become: true
  roles:
    - backend

- name: Initialize and verify the EpicBook database
  hosts: backend
  become: true
  roles:
    - database

- name: Start EpicBook after database initialization
  hosts: backend
  become: true
  tasks:
    - name: Enable and restart EpicBook
      ansible.builtin.systemd:
        name: epicbook
        enabled: true
        state: restarted
        daemon_reload: true

- name: Configure the EpicBook frontend
  hosts: frontend
  become: true
  roles:
    - frontend
